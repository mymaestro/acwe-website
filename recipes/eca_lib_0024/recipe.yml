name: 'Send email to users of a given role'
description: 'Emails every user holding a given role, using a view with a contextual filter to select the recipients.'
type: Workflow
install:
  - eca_base
  - eca_content
  - eca_user
  - eca_views
  - modeler_api
  - user
config:
  strict: false
  import:
    user:
      - views.view.user_admin_people
