langcode: en
status: true
dependencies:
  config:
    - views.view.user_admin_people
  module:
    - eca_base
    - eca_content
    - eca_user
    - eca_views
    - modeler_api
third_party_settings:
  modeler_api:
    storage: none
    label: 'Send email to users of a given role'
    documentation: |-
      This model sends an email to all users of a certain role. It contains a view with a contextual filter to limit the list of users to those of the given role.

      The creation of this model was recorded with lots of additional explanations (e.g. how to use an existing model as a starting point) and [can be watched here](https://tube.tchncs.de/w/8dZuXYZHmuDTutddrTZUfE).
    summary: 'Emails every user holding a given role, using a view with a contextual filter to select the recipients.'
    tags:
      - simple
      - views
      - loop
      - 'custom event'
      - 'switch user'
      - email
    version: v1
id: eca_lib_0024
weight: 0
template: null
events:
  Event_1up81dz:
    plugin: 'eca_base:eca_custom'
    label: 'Custom event email'
    configuration:
      event_id: email
    successors:
      -
        id: Activity_0ha3xin
        condition: ''
  Event_1asjw3k:
    plugin: 'content_entity:custom'
    label: X1
    configuration:
      event_id: x1
    successors:
      -
        id: Activity_0xpew34
        condition: ''
conditions: {  }
gateways: {  }
actions:
  Activity_08o1wo5:
    label: 'List users'
    plugin: eca_views_query
    configuration:
      token_name: userlist
      view_id: user_admin_people
      display_id: attachment_1
      arguments: administrator
    successors:
      -
        id: Activity_105ssdc
        condition: ''
  Activity_0ha3xin:
    label: 'Switch user'
    plugin: eca_switch_account
    configuration:
      user_id: '1'
    successors:
      -
        id: Activity_08o1wo5
        condition: ''
  Activity_105ssdc:
    label: 'Trigger X1'
    plugin: eca_trigger_content_entity_custom_event
    configuration:
      event_id: x1
      tokens: ''
      object: userlist
    successors: {  }
  Activity_0xpew34:
    label: Email
    plugin: action_send_email_action
    configuration:
      recipient: '[entity:mail]'
      subject: 'This email comes from ECA'
      message: 'Hello [entity:name]'
      replace_tokens: true
    successors: {  }
